<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnlyMaxon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      text-align: center;
      padding: 48px;
      border: 1px solid #30363d;
      border-radius: 12px;
      background: #161b22;
      max-width: 480px;
      width: 90%;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #238636, #1f6feb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto 24px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #f0f6fc;
    }

    p {
      color: #8b949e;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-block;
      background: #238636;
      color: #aff5b4;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    .status {
      margin-top: 32px;
      padding: 12px 20px;
      background: #0d1117;
      border-radius: 8px;
      font-size: 13px;
      color: #3fb950;
      border: 1px solid #238636;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">M</div>
    <h1>OnlyMaxon</h1>
    <p>GitHub Pages работает.<br>Репозиторий активен.</p>
    <span class="badge">LIVE</span>
    <div class="status">index.html загружен успешно</div>
  </div>
</body>
</html>
